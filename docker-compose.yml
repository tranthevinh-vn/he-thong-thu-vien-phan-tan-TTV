name: ptudpt-library

# Toan bo he thong (full stack) - chay trong VM khi chot/demo.
# Chay: docker compose up -d --build
services:
  postgres:
    image: postgres:16
    container_name: library-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-library}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-library_pass}
      POSTGRES_DB: ${POSTGRES_DB:-library_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-library} -d ${POSTGRES_DB:-library_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: library-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-library}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-library_pass}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/Library.Api/Dockerfile
    container_name: library-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-library_db};Username=${POSTGRES_USER:-library};Password=${POSTGRES_PASSWORD:-library_pass}"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: ${RABBITMQ_USER:-library}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-library_pass}
      Database__AutoMigrate: "true"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8080:8080"

  worker:
    build:
      context: .
      dockerfile: src/Library.Worker/Dockerfile
    container_name: library-worker
    restart: unless-stopped
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-library_db};Username=${POSTGRES_USER:-library};Password=${POSTGRES_PASSWORD:-library_pass}"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: ${RABBITMQ_USER:-library}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-library_pass}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  audit:
    build:
      context: .
      dockerfile: src/Library.Audit/Dockerfile
    container_name: library-audit
    restart: unless-stopped
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-library_db};Username=${POSTGRES_USER:-library};Password=${POSTGRES_PASSWORD:-library_pass}"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: ${RABBITMQ_USER:-library}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-library_pass}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  client-web:
    build:
      context: .
      dockerfile: src/Library.Client.Web/Dockerfile
    container_name: library-client
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      LibraryApi__BaseUrl: http://api:8080
    depends_on:
      - api
    ports:
      - "8081:8080"

volumes:
  postgres_data:
  rabbitmq_data:
